# アプリケーション基本設定
spring.application.name=demo-java-crm
server.port=8080

# ログレベル
logging.level.root=INFO
logging.level.com.example.crm=DEBUG

# PostgreSQL データソース
spring.datasource.url=jdbc:postgresql://postgres-db:5432/crm
spring.datasource.username=crm_user
spring.datasource.password=crm_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL初期化（schema.sql / data.sql を毎回実行）
spring.sql.init.mode=always
