# アプリケーション基本設定
spring.application.name=demo-java-crm
server.port=8080

# ログレベル
logging.level.root=INFO
logging.level.com.example.crm=DEBUG

# PostgreSQL データソース
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL初期化（schema.sql / data.sql を毎回実行）
spring.sql.init.mode=always
