<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラー - CRMデモ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>エラー</h1>

        <div class="error-message">
            <p th:text="${message}">リクエストの処理中にエラーが発生しました。</p>
        </div>

        <div class="actions">
            <a th:href="@{/customers}" class="btn btn-primary">顧客一覧に戻る</a>
        </div>
    </div>
</body>
</html>
